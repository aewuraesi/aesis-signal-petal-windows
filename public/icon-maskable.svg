<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Signal Petal</title>
  <!-- Full bleed with the mark inside the 40% safe radius: Android and the PWA installer
       apply their own mask to this one, so rounded corners here would be clipped twice. -->
  <defs><linearGradient id="petalM" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse"><stop stop-color="#E95D9C"/><stop offset="1" stop-color="#9B64C2"/></linearGradient></defs>
  <rect width="512" height="512" fill="url(#petalM)"/>
  <g fill="#FFF9FC" transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <path d="M256 106C324 152 333 224 256 276C179 224 188 152 256 106Z"/>
    <path d="M256 106C324 152 333 224 256 276C179 224 188 152 256 106Z" transform="rotate(72 256 256)"/>
    <path d="M256 106C324 152 333 224 256 276C179 224 188 152 256 106Z" transform="rotate(144 256 256)"/>
    <path d="M256 106C324 152 333 224 256 276C179 224 188 152 256 106Z" transform="rotate(216 256 256)"/>
    <path d="M256 106C324 152 333 224 256 276C179 224 188 152 256 106Z" transform="rotate(288 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="22.6" fill="url(#petalM)"/>
</svg>
